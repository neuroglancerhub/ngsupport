# Config for the /multires-mesh endpoints (see ngsupport/multires_mesh.py).
#
# These are the same settings used by neuclease.misc.multiresmesh (see MultiresMeshConfigSchema),
# and the flyemflows 'multiresbodymeshes' workflow ('mesh-config').
# A complete multiresbodymeshes workflow config would also be accepted here.
#
# Neuroglancer source:
#   precomputed://https://<ngsupport-host>/multires-mesh/<dvid-server>/<uuid>/<segmentation>/512_ddeda

# Each chunk (the cells of the finest LOD) is meshed independently, with a halo
# (in source-scale voxels).  Our version of the fish uses 16nm voxels.
chunk-shape-s0: [512, 512, 512]
chunk-halo: 2
source-scale: 1
morphological-closing-s0: 8
fill-holes: true
smoothing: 3

# One decimation error threshold per LOD, in squared full-resolution voxels.
# (These were calibrated for source-scale 2, chunk-halo 8, and smoothing 2,
# for which they keep about 16% and 4% of the undecimated faces.)
lod-error-thresholds: [8, 75]
vertex-quantization-bits: 16

# Chunks whose surface_mutid is unset are assumed to be up-to-date with this UUID.
base-uuid: ddeda82d31c94dfca506db671b03a4bf

# Where to store body meshes: 'dvid' (the default) or a bucket URL.
# In a bucket, the newest mesh of each body on the 'live-ref' branch is stored as
# '<body>' (a standard precomputed mesh source), and other UUIDs' meshes as '<body>-<uuid>'.
# (The bucket must be publicly readable, with CORS enabled; see ngsupport/multires_mesh.py.)
# storage: gs://my-bucket/yakuba/segmentation/body-meshes
# live-ref: master
