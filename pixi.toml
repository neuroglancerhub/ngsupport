[workspace]
authors = ["Stuart Berg <bergs@janelia.hhmi.org>"]
channels = ["conda-forge", "flyem-forge"]
name = "ngsupport"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.14.10,<3.15"
flask = ">=3.1.3,<4"
flask-cors = ">=6.0.5,<7"
flask-compress = ">=1.26,<2"
gunicorn = ">=26.2.0,<27"
google-cloud-storage = ">=3.17.0,<4"
neuclease = ">=0.100.post0.dev22,<0.101"
vol2mesh = ">=0.3.post10,<0.4"
trimesh = ">=5.2.0,<6"  # Used by vol2mesh.multires (multires-mesh endpoints)

[pypi-dependencies]
tensorstore = ">=0.1.86, <0.2"
neuroglancer = ">=2.41.2, <3"
dracopy = "*"  # Used by vol2mesh.multires (multires-mesh endpoints)
